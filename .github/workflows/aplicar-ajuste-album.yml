name: Aplicar ajuste final do album

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aplicar-ajuste-album.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar CSS do album 3D
        shell: python
        run: |
          from pathlib import Path
          p = Path('css/style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* AJUSTE FINAL ALBUM 3D GABI TOM */'
          if marker not in s:
              s += r'''

/* AJUSTE FINAL ALBUM 3D GABI TOM */
.memorias-layout{
    margin-top:0 !important;
    gap:28px !important;
}
.album-folha{
    overflow:visible !important;
    perspective:1600px !important;
    transform-style:preserve-3d !important;
    transform-origin:left center !important;
}
.album-foto{
    transform-origin:left center !important;
    backface-visibility:hidden !important;
    -webkit-backface-visibility:hidden !important;
    will-change:transform;
}
.album-foto.virando-esquerda{
    animation:albumPaginaEsquerdaFinal .88s cubic-bezier(.55,.08,.35,1) forwards !important;
}
.album-foto.virando-direita{
    transform-origin:right center !important;
    animation:albumPaginaDireitaFinal .88s cubic-bezier(.55,.08,.35,1) forwards !important;
}
@keyframes albumPaginaEsquerdaFinal{
    0%{transform:perspective(1600px) rotateY(0deg) translateZ(0);filter:brightness(1)}
    18%{transform:perspective(1600px) rotateY(-32deg) translateZ(3px);filter:brightness(.98)}
    48%{transform:perspective(1600px) rotateY(-105deg) translateZ(8px);filter:brightness(.90)}
    78%{transform:perspective(1600px) rotateY(-158deg) translateZ(4px);filter:brightness(.96)}
    100%{transform:perspective(1600px) rotateY(-180deg) translateZ(0);filter:brightness(1)}
}
@keyframes albumPaginaDireitaFinal{
    0%{transform:perspective(1600px) rotateY(0deg) translateZ(0);filter:brightness(1)}
    18%{transform:perspective(1600px) rotateY(32deg) translateZ(3px);filter:brightness(.98)}
    48%{transform:perspective(1600px) rotateY(105deg) translateZ(8px);filter:brightness(.90)}
    78%{transform:perspective(1600px) rotateY(158deg) translateZ(4px);filter:brightness(.96)}
    100%{transform:perspective(1600px) rotateY(180deg) translateZ(0);filter:brightness(1)}
}
@media (max-width:850px){.memorias-layout{margin-top:12px !important;gap:24px !important;}}
@media (max-width:600px){.memorias-layout{margin-top:8px !important;gap:20px !important;}}
'''
              p.write_text(s, encoding='utf-8')

      - name: Commitar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Ajusta album 3D e aproxima Nosso grande dia'
          git push
