name: Ajustar album 3D

on:
  push:
    paths:
      - '.github/workflows/ajuste-album.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes no index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Aproxima a secao Nosso grande dia do bloco superior.
          s = s.replace('margin:20px auto 90px;', 'margin:0 auto 90px;', 1)
          s = s.replace('gap:35px;', 'gap:28px;', 1)

          # 2) Substitui a animacao atual por uma virada 3D mais fisica.
          inicio = s.index('/* =====================================================\n   FOLHA DO ÁLBUM')
          fim = s.index('/* =====================================================\n   LEGENDA', inicio)
          bloco = r'''/* =====================================================
   FOLHA DO ÁLBUM — VIRADA 3D REAL
===================================================== */

.album-folha{
    position:relative;
    width:100%;
    aspect-ratio:4 / 5;
    overflow:visible;
    background:linear-gradient(135deg,#faf8f3,#eee7dc);
    box-shadow:inset 0 0 0 1px rgba(107,81,69,.08);
    perspective:1600px;
    transform-style:preserve-3d;
    transform-origin:left center;
}

.album-folha:before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:0;
    width:6px;
    background:linear-gradient(to right,rgba(80,60,45,.18),rgba(255,255,255,.10),transparent);
    z-index:40;
    pointer-events:none;
}

.album-folha:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,#f8f4ed,#e7dfd3);
    border:1px solid rgba(107,81,69,.10);
    box-shadow:inset -12px 0 20px rgba(80,60,45,.05);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform:rotateY(180deg) translateZ(1px);
    transform-origin:left center;
    pointer-events:none;
    z-index:0;
}

.album-foto{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    z-index:2;
    pointer-events:none;
    transform-origin:left center;
    transform:translateZ(3px);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    will-change:transform;
    transition:none;
}

.album-legenda{
    z-index:10;
}

.album.folha-virando .album-folha{
    box-shadow:0 22px 45px rgba(60,45,38,.18);
}

.album-folha.virando-esquerda{
    animation:pagina3DEsquerda .86s cubic-bezier(.55,.08,.35,1) forwards;
}

.album-folha.virando-direita{
    transform-origin:right center;
    animation:pagina3DDireita .86s cubic-bezier(.55,.08,.35,1) forwards;
}

@keyframes pagina3DEsquerda{
    0%{transform:rotateY(0deg);box-shadow:0 8px 18px rgba(60,45,38,.05)}
    18%{transform:rotateY(-32deg);box-shadow:8px 14px 25px rgba(60,45,38,.12)}
    48%{transform:rotateY(-105deg);box-shadow:22px 20px 32px rgba(60,45,38,.20)}
    78%{transform:rotateY(-160deg);box-shadow:12px 16px 25px rgba(60,45,38,.13)}
    100%{transform:rotateY(-180deg);box-shadow:0 8px 18px rgba(60,45,38,.05)}
}

@keyframes pagina3DDireita{
    0%{transform:rotateY(0deg);box-shadow:0 8px 18px rgba(60,45,38,.05)}
    18%{transform:rotateY(32deg);box-shadow:-8px 14px 25px rgba(60,45,38,.12)}
    48%{transform:rotateY(105deg);box-shadow:-22px 20px 32px rgba(60,45,38,.20)}
    78%{transform:rotateY(160deg);box-shadow:-12px 16px 25px rgba(60,45,38,.13)}
    100%{transform:rotateY(180deg);box-shadow:0 8px 18px rgba(60,45,38,.05)}
}

.album-folha.nova-folha-esquerda{
    animation:pagina3DVoltaEsquerda .86s cubic-bezier(.55,.08,.35,1) forwards;
}

.album-folha.nova-folha-direita{
    transform-origin:right center;
    animation:pagina3DVoltaDireita .86s cubic-bezier(.55,.08,.35,1) forwards;
}

@keyframes pagina3DVoltaEsquerda{
    0%{transform:rotateY(180deg)}
    18%{transform:rotateY(148deg)}
    48%{transform:rotateY(75deg)}
    78%{transform:rotateY(22deg)}
    100%{transform:rotateY(0deg)}
}

@keyframes pagina3DVoltaDireita{
    0%{transform:rotateY(-180deg)}
    18%{transform:rotateY(-148deg)}
    48%{transform:rotateY(-75deg)}
    78%{transform:rotateY(-22deg)}
    100%{transform:rotateY(0deg)}
}

@media(max-width:850px){
    .memorias-layout{margin-top:18px;gap:25px}
}

@media(max-width:600px){
    .memorias-layout{margin-top:12px;gap:22px}
}

'''
          s = s[:inicio] + bloco + s[fim:]

          # Ajusta o JS para animar a folha inteira, incluindo a legenda,
          # em vez de girar somente a fotografia.
          s = s.replace('''    albumFoto.classList.remove(\n        "virando-esquerda",\n        "virando-direita",\n        "nova-folha-esquerda",\n        "nova-folha-direita"\n    );''','''    albumFoto.classList.remove(\n        "virando-esquerda",\n        "virando-direita",\n        "nova-folha-esquerda",\n        "nova-folha-direita"\n    );\n\n    const albumFolha = document.getElementById("albumFolha");\n    albumFolha.classList.remove(\n        "virando-esquerda",\n        "virando-direita",\n        "nova-folha-esquerda",\n        "nova-folha-direita"\n    );''',1)

          s = s.replace('''        albumFoto.classList.add(\n            "virando-esquerda"\n        );''','''        albumFolha.classList.add(\n            "virando-esquerda"\n        );''',1)
          s = s.replace('''        albumFoto.classList.add("virando-direita"\n        );''','''        albumFolha.classList.add("virando-direita"\n        );''',1)
          s = s.replace('''        albumFoto.classList.remove(\n            "virando-esquerda",\n            "virando-direita"\n        );''','''        albumFolha.classList.remove(\n            "virando-esquerda",\n            "virando-direita"\n        );''',1)
          s = s.replace('''            albumFoto.classList.add(\n                "nova-folha-esquerda"\n            );''','''            albumFolha.classList.add(\n                "nova-folha-esquerda"\n            );''',1)
          s = s.replace('''            albumFoto.classList.add(\n                "nova-folha-direita"\n            );''','''            albumFolha.classList.add(\n                "nova-folha-direita"\n            );''',1)
          s = s.replace('''            albumFoto.classList.remove(\n                "nova-folha-esquerda",\n                "nova-folha-direita"\n            );''','''            albumFolha.classList.remove(\n                "nova-folha-esquerda",\n                "nova-folha-direita"\n            );''',1)

          p.write_text(s, encoding='utf-8')
      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ajusta album com virada 3D e espacamento"
          git push
